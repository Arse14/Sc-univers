name: Build Windows

# - À chaque push sur main (et à la demande) : compile l'installeur Windows
#   et le dépose en artefact téléchargeable depuis l'onglet Actions.
# - Sur un tag v*, ou à la demande avec un nom de tag : crée en plus une Release GitHub avec les installeurs.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publier une Release sous ce tag (ex. v0.1.0). Vide = simple artefact."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (artefact de test)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event.inputs.release_tag == '' }}
        run: npm run tauri build

      - name: Déposer les installeurs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event.inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SC-Univers-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.release_tag || github.ref_name }}
          releaseName: "SC-Univers ${{ github.event.inputs.release_tag || github.ref_name }}"
          releaseBody: "Installeurs Windows (NSIS .exe et MSI). Non affilié à Cloud Imperium Games."
          releaseDraft: false
          prerelease: true
